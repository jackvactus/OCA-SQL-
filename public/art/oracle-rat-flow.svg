<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Chaine Real Application Testing : capture en production, rejeu sur la base de test, comparaison des rapports avant et apres">
  <defs>
    <linearGradient id="ratBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0510"/><stop offset="100%" stop-color="#2b0a1e"/>
    </linearGradient>
    <marker id="ratArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#fda4af"/>
    </marker>
  </defs>

  <rect width="800" height="460" fill="url(#ratBg)"/>

  <text x="40" y="40" fill="#fda4af" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2.5">REAL APPLICATION TESTING — PROUVER AVANT DE SUBIR</text>

  <!-- Ligne SPA -->
  <text x="40" y="86" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">SQL Performance Analyzer — instruction par instruction</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="40" y="102" width="150" height="74" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="115" y="130" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">SQL Tuning Set</text>
    <text x="115" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">capturé depuis AWR</text>
    <text x="115" y="166" text-anchor="middle" fill="#64748b" font-size="10.5">texte + binds + stats</text>

    <path d="M190 139 H228" stroke="#fda4af" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="236" y="102" width="140" height="74" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="306" y="130" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Exécution AVANT</text>
    <text x="306" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">TEST EXECUTE</text>

    <path d="M376 139 H414" stroke="#fda4af" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="422" y="102" width="140" height="74" rx="12" fill="#241016" stroke="#fbbf24" stroke-opacity="0.6" stroke-dasharray="6 4"/>
    <text x="492" y="130" text-anchor="middle" fill="#fde68a" font-size="12.5" font-weight="700">LE CHANGEMENT</text>
    <text x="492" y="150" text-anchor="middle" fill="#94a3b8" font-size="11">version, paramètre,</text>
    <text x="492" y="166" text-anchor="middle" fill="#94a3b8" font-size="11">index, statistiques</text>

    <path d="M562 139 H600" stroke="#fda4af" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="608" y="102" width="150" height="74" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="683" y="130" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Exécution APRÈS</text>
    <text x="683" y="152" text-anchor="middle" fill="#94a3b8" font-size="11">puis COMPARE</text>
  </g>

  <!-- Verdict SPA -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="236" y="196" width="150" height="42" rx="10" fill="#052e1e" stroke="#4ade80" stroke-opacity="0.5"/>
    <text x="311" y="222" text-anchor="middle" fill="#86efac" font-size="12" font-weight="700">améliorées</text>
    <rect x="400" y="196" width="150" height="42" rx="10" fill="#1c1917" stroke="#94a3b8" stroke-opacity="0.4"/>
    <text x="475" y="222" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="700">inchangées</text>
    <rect x="564" y="196" width="194" height="42" rx="10" fill="#2e0512" stroke="#fb7185" stroke-opacity="0.7"/>
    <text x="661" y="222" text-anchor="middle" fill="#fecdd3" font-size="12" font-weight="700">RÉGRESSÉES — les seules qui comptent</text>
  </g>

  <line x1="40" y1="266" x2="760" y2="266" stroke="#fb7185" stroke-opacity="0.2" stroke-width="1.5"/>

  <!-- Ligne Database Replay -->
  <text x="40" y="298" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700">Database Replay — la charge entière, avec sa concurrence</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="40" y="316" width="170" height="80" rx="12" fill="#1c0a16" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="125" y="344" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">PRODUCTION</text>
    <text x="125" y="364" text-anchor="middle" fill="#c4b5fd" font-size="11">START_CAPTURE</text>
    <text x="125" y="382" text-anchor="middle" fill="#64748b" font-size="10.5">tout le trafic client</text>

    <path d="M210 356 H252" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="260" y="316" width="150" height="80" rx="12" fill="#1c0a16" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="335" y="344" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Fichiers de capture</text>
    <text x="335" y="364" text-anchor="middle" fill="#c4b5fd" font-size="11">PROCESS_CAPTURE</text>
    <text x="335" y="382" text-anchor="middle" fill="#64748b" font-size="10.5">+ temps de réflexion</text>

    <path d="M410 356 H452" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="460" y="316" width="150" height="80" rx="12" fill="#1c0a16" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="535" y="344" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">BASE DE TEST</text>
    <text x="535" y="364" text-anchor="middle" fill="#c4b5fd" font-size="11">clients wrc</text>
    <text x="535" y="382" text-anchor="middle" fill="#fbbf24" font-size="10.5">restaurée au SCN de départ</text>

    <path d="M610 356 H652" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#ratArrow)"/>

    <rect x="660" y="316" width="98" height="80" rx="12" fill="#2e0512" stroke="#fb7185" stroke-opacity="0.6"/>
    <text x="709" y="350" text-anchor="middle" fill="#fecdd3" font-size="12" font-weight="700">Rapport de</text>
    <text x="709" y="368" text-anchor="middle" fill="#fecdd3" font-size="12" font-weight="700">divergences</text>
  </g>

  <text x="400" y="434" text-anchor="middle" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5">Option payante de l'Enterprise Edition — les SQL Tuning Sets, eux, relèvent du Tuning Pack</text>
</svg>
