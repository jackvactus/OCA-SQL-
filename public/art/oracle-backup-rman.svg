<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="RMAN backup and recovery cycle">
  <defs>
    <linearGradient id="obBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05121d"/>
      <stop offset="100%" stop-color="#0a2334"/>
    </linearGradient>
    <linearGradient id="obCyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f04438"/>
      <stop offset="100%" stop-color="#a4180f"/>
    </linearGradient>
    <radialGradient id="obHalo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="obGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <marker id="obArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="url(#obBg)"/>
  <rect width="1200" height="800" fill="url(#obGrid)"/>
  <rect width="1200" height="800" fill="url(#obHalo)"/>

  <text x="600" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2f4ff">RMAN backup &amp; recovery</text>

  <!-- Database cylinder, left -->
  <g transform="translate(300 400)">
    <ellipse cx="0" cy="140" rx="150" ry="34" fill="#000" fill-opacity="0.3"/>
    <path d="M-140 -40a140 34 0 0 1 280 0v160a140 34 0 0 1-280 0Z" fill="url(#obCyl)"/>
    <ellipse cx="0" cy="-40" rx="140" ry="34" fill="#fb7185" stroke="#fecdd3" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="-32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#4c0d0d">DATABASE</text>
    <text x="0" y="220" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#fecdd3" opacity="0.85">Target database</text>
  </g>

  <!-- Backup set, right -->
  <g transform="translate(900 340)">
    <rect x="-110" y="-90" width="220" height="180" rx="18" fill="#0d2a3f" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="-80" y="-56" width="160" height="24" rx="6" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="-80" y="-20" width="160" height="24" rx="6" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <rect x="-80" y="16" width="160" height="24" rx="6" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="0" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#bae6fd" opacity="0.9">Backup set (disk / FRA)</text>
  </g>

  <!-- Cycle arrows -->
  <path d="M470 340 C 610 220, 680 220, 780 300" fill="none" stroke="#7dd3fc" stroke-width="4" marker-end="url(#obArrow)"/>
  <path d="M780 440 C 680 540, 560 540, 460 460" fill="none" stroke="#fecdd3" stroke-width="4" marker-end="url(#obArrow)"/>

  <text x="620" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#7dd3fc">BACKUP DATABASE</text>
  <text x="620" y="580" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fecdd3">RESTORE + RECOVER</text>

  <!-- SCN / timeline strip -->
  <g transform="translate(600 660)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="-420" y1="0" x2="420" y2="0" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="2"/>
    <g fill="#7dd3fc">
      <circle cx="-300" cy="0" r="7"/>
      <circle cx="-60" cy="0" r="7"/>
      <circle cx="220" cy="0" r="7"/>
      <circle cx="380" cy="0" r="9" fill="#f04438"/>
    </g>
    <g font-size="15" fill="#93c5fd">
      <text x="-300" y="30" text-anchor="middle">Full backup</text>
      <text x="-60" y="30" text-anchor="middle">Incremental</text>
      <text x="220" y="30" text-anchor="middle">Archived redo</text>
      <text x="380" y="30" text-anchor="middle" fill="#fecdd3">Point of failure</text>
    </g>
  </g>

  <text x="600" y="750" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#93c5fd" opacity="0.75">Restore the datafiles, then recover by applying redo up to the point of failure</text>
</svg>
