<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Optimisation Oracle : modele de temps, evenements d'attente et rapports AWR">
  <defs>
    <linearGradient id="tuBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0510"/><stop offset="100%" stop-color="#2b0a1e"/>
    </linearGradient>
    <linearGradient id="tuBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#9f1239"/><stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="tuBar2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c2d12"/><stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <pattern id="tuGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fb7185" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#tuBg)"/>
  <rect width="800" height="600" fill="url(#tuGrid)"/>

  <text x="56" y="66" fill="#fda4af" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">1Z0-084 · PERFORMANCE &amp; TUNING</text>
  <text x="56" y="102" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="26" font-weight="700">Où part le DB time ?</text>

  <!-- Histogramme des classes d'attente -->
  <g>
    <line x1="80" y1="400" x2="740" y2="400" stroke="#fb7185" stroke-opacity="0.35" stroke-width="1.5"/>
    <line x1="80" y1="160" x2="80" y2="400" stroke="#fb7185" stroke-opacity="0.35" stroke-width="1.5"/>

    <rect x="112" y="188" width="62" height="212" rx="6" fill="url(#tuBar)"/>
    <rect x="212" y="252" width="62" height="148" rx="6" fill="url(#tuBar)" opacity="0.85"/>
    <rect x="312" y="298" width="62" height="102" rx="6" fill="url(#tuBar2)"/>
    <rect x="412" y="332" width="62" height="68" rx="6" fill="url(#tuBar2)" opacity="0.85"/>
    <rect x="512" y="356" width="62" height="44" rx="6" fill="#a78bfa" opacity="0.7"/>
    <rect x="612" y="374" width="62" height="26" rx="6" fill="#38bdf8" opacity="0.6"/>

    <text x="143" y="176" text-anchor="middle" fill="#ffe4e6" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">41 %</text>
    <text x="243" y="240" text-anchor="middle" fill="#ffe4e6" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">23 %</text>
    <text x="343" y="286" text-anchor="middle" fill="#ffedd5" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">16 %</text>
    <text x="443" y="320" text-anchor="middle" fill="#ffedd5" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">11 %</text>
    <text x="543" y="344" text-anchor="middle" fill="#ede9fe" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">6 %</text>
    <text x="643" y="362" text-anchor="middle" fill="#e0f2fe" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">3 %</text>

    <text x="143" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">User I/O</text>
    <text x="243" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">CPU</text>
    <text x="343" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Concurrency</text>
    <text x="443" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Commit</text>
    <text x="543" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Config</text>
    <text x="643" y="424" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Autres</text>
  </g>

  <!-- Chaine d'outils -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="80" y="472" width="150" height="60" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.45"/>
    <text x="155" y="498" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">AWR</text>
    <text x="155" y="518" text-anchor="middle" fill="#94a3b8" font-size="11.5">1 instantané / h</text>

    <rect x="252" y="472" width="150" height="60" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.45"/>
    <text x="327" y="498" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ASH</text>
    <text x="327" y="518" text-anchor="middle" fill="#94a3b8" font-size="11.5">1 échantillon / s</text>

    <rect x="424" y="472" width="150" height="60" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.45"/>
    <text x="499" y="498" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">ADDM</text>
    <text x="499" y="518" text-anchor="middle" fill="#94a3b8" font-size="11.5">constats classés</text>

    <rect x="596" y="472" width="150" height="60" rx="12" fill="#1c0a16" stroke="#fb7185" stroke-opacity="0.45"/>
    <text x="671" y="498" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Advisors</text>
    <text x="671" y="518" text-anchor="middle" fill="#94a3b8" font-size="11.5">gain chiffré</text>

    <path d="M230 502 H252 M402 502 H424 M574 502 H596" stroke="#fb7185" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <text x="400" y="566" text-anchor="middle" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="12.5">DB time = CPU + attentes · un ratio n'est jamais un temps</text>
</svg>
