<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" width="1400" height="620" role="img" aria-label="Parcours de certification Oracle Database : 1Z0-071, 1Z0-082, 1Z0-083, puis les specialisations 1Z0-084, 1Z0-076 et 1Z0-078">
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04121c"/>
      <stop offset="100%" stop-color="#0a2231"/>
    </linearGradient>
    <linearGradient id="cpPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f04438"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cp1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f04438"/><stop offset="100%" stop-color="#b42318"/></linearGradient>
    <linearGradient id="cp2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="cp3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
    <linearGradient id="cp4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb7185"/><stop offset="100%" stop-color="#9f1239"/></linearGradient>
    <linearGradient id="cp5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#5b21b6"/></linearGradient>
    <linearGradient id="cp6" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <pattern id="cpGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="620" fill="url(#cpBg)"/>
  <rect width="1400" height="620" fill="url(#cpGrid)"/>

  <!-- Titres de niveau -->
  <text x="80" y="62" fill="#7dd3fc" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">SOCLE — PARCOURS PRINCIPAL</text>
  <text x="80" y="392" fill="#c4b5fd" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5">SPÉCIALISATIONS</text>

  <!-- Chemin principal -->
  <path d="M250 190 H1150" stroke="url(#cpPath)" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Étape 1 — 1Z0-071 -->
  <g>
    <rect x="90" y="100" width="320" height="180" rx="20" fill="#0b2233" stroke="#f04438" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="140" cy="150" r="24" fill="url(#cp1)"/>
    <text x="140" y="157" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">1</text>
    <text x="180" y="145" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">1Z0-071</text>
    <text x="180" y="170" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Oracle Database SQL</text>
    <text x="120" y="212" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="14">SQL Certified Associate</text>
    <text x="120" y="240" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">63 questions · 120 min · 63 %</text>
  </g>

  <!-- Étape 2 — 1Z0-082 -->
  <g>
    <rect x="540" y="100" width="320" height="180" rx="20" fill="#0b2233" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="590" cy="150" r="24" fill="url(#cp2)"/>
    <text x="590" y="157" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">2</text>
    <text x="630" y="145" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">1Z0-082</text>
    <text x="630" y="170" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Administration I</text>
    <text x="570" y="212" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Administration 2019 — étape 1</text>
    <text x="570" y="240" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">72 questions · 120 min · 60 %</text>
  </g>

  <!-- Étape 3 — 1Z0-083 -->
  <g>
    <rect x="990" y="100" width="320" height="180" rx="20" fill="#0b2233" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1040" cy="150" r="24" fill="url(#cp3)"/>
    <text x="1040" y="157" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700">3</text>
    <text x="1080" y="145" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">1Z0-083</text>
    <text x="1080" y="170" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Administration II</text>
    <text x="1020" y="212" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="14">Certified Professional</text>
    <text x="1020" y="240" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">68 questions · 120 min · 57 %</text>
  </g>

  <!-- Embranchement vers les specialisations -->
  <path d="M1150 280 V330 H250 V430" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path d="M700 330 V430" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>
  <path d="M1150 330 V430" fill="none" stroke="#7c3aed" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- Specialisation 1 — 1Z0-084 -->
  <g>
    <rect x="90" y="430" width="320" height="140" rx="20" fill="#0b2233" stroke="#fb7185" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="140" cy="478" r="22" fill="url(#cp4)"/>
    <text x="140" y="485" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">P</text>
    <text x="176" y="474" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">1Z0-084</text>
    <text x="176" y="497" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="13.5">Performance &amp; Tuning</text>
    <text x="120" y="540" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">55 questions · 90 min · 60 %</text>
  </g>

  <!-- Specialisation 2 — 1Z0-076 -->
  <g>
    <rect x="540" y="430" width="320" height="140" rx="20" fill="#0b2233" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="590" cy="478" r="22" fill="url(#cp5)"/>
    <text x="590" y="485" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">D</text>
    <text x="626" y="474" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">1Z0-076</text>
    <text x="626" y="497" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="13.5">Data Guard</text>
    <text x="570" y="540" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">74 questions · 120 min · 61 %</text>
  </g>

  <!-- Specialisation 3 — 1Z0-078 -->
  <g>
    <rect x="990" y="430" width="320" height="140" rx="20" fill="#0b2233" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="1.5"/>
    <circle cx="1040" cy="478" r="22" fill="url(#cp6)"/>
    <text x="1040" y="485" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">R</text>
    <text x="1076" y="474" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700">1Z0-078</text>
    <text x="1076" y="497" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="13.5">RAC, ASM &amp; Grid</text>
    <text x="1020" y="540" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="13">77 questions · 120 min · 65 %</text>
  </g>
</svg>
