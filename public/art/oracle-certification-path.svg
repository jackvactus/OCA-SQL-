<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" width="1400" height="520" role="img" aria-label="Parcours de certification Oracle Database : 1Z0-071, 1Z0-082, 1Z0-083">
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04121c"/>
      <stop offset="100%" stop-color="#0a2231"/>
    </linearGradient>
    <linearGradient id="cpPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f04438"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cp1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f04438"/><stop offset="100%" stop-color="#b42318"/>
    </linearGradient>
    <linearGradient id="cp2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cp3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="cpGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1400" height="520" fill="url(#cpBg)"/>
  <rect width="1400" height="520" fill="url(#cpGrid)"/>

  <!-- chemin -->
  <path d="M232 250 H 1168" stroke="url(#cpPath)" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  <g stroke="#7dd3fc" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 14" stroke-linecap="round">
    <path d="M232 250 H 1168"/>
  </g>

  <!-- étape 1 : OCA SQL -->
  <g transform="translate(232 250)">
    <circle r="72" fill="url(#cp1)"/>
    <circle r="72" fill="none" stroke="#fecdd3" stroke-opacity="0.45" stroke-width="3"/>
    <circle r="86" fill="none" stroke="#f04438" stroke-opacity="0.28" stroke-width="2"/>
    <text y="-8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff">OCA</text>
    <text y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" fill-opacity="0.92">SQL</text>
    <text y="-118" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fca5a5">1Z0-071</text>
    <text y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Oracle Database SQL</text>
    <text y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Certified Associate</text>
    <text y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">63 questions · 120 min · 63 %</text>
  </g>

  <!-- étape 2 : OCP I -->
  <g transform="translate(700 250)">
    <circle r="72" fill="url(#cp2)"/>
    <circle r="72" fill="none" stroke="#bae6fd" stroke-opacity="0.45" stroke-width="3"/>
    <text y="-8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff">OCP</text>
    <text y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" fill-opacity="0.92">I</text>
    <text y="-118" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#7dd3fc">1Z0-082</text>
    <text y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Database Administration I</text>
    <text y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Certified Professional</text>
    <text y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">72 questions · 120 min · 60 %</text>
  </g>

  <!-- étape 3 : OCP II -->
  <g transform="translate(1168 250)">
    <circle r="72" fill="url(#cp3)"/>
    <circle r="72" fill="none" stroke="#fde68a" stroke-opacity="0.45" stroke-width="3"/>
    <text y="-8" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#3f2200">OCP</text>
    <text y="20" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#3f2200" fill-opacity="0.92">II</text>
    <text y="-118" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#fcd34d">1Z0-083</text>
    <text y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">Database Administration II</text>
    <text y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#94a3b8">Certified Professional</text>
    <text y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">68 questions · 120 min · 57 %</text>
  </g>

  <!-- jalons intermédiaires -->
  <g fill="#7dd3fc">
    <circle cx="466" cy="250" r="7"/>
    <circle cx="934" cy="250" r="7"/>
  </g>
</svg>
