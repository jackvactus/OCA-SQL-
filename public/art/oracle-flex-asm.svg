<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="Comparaison entre ASM classique, une instance par noeud, et Flex ASM ou trois instances ASM servent tous les noeuds par le reseau ASM">
  <defs>
    <linearGradient id="faBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04140f"/><stop offset="100%" stop-color="#062a26"/>
    </linearGradient>
    <linearGradient id="faAsm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <pattern id="faGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="460" fill="url(#faBg)"/>
  <rect width="800" height="460" fill="url(#faGrid)"/>
  <line x1="400" y1="30" x2="400" y2="430" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 6"/>

  <text x="36" y="44" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ASM CLASSIQUE — une instance par nœud</text>
  <text x="436" y="44" fill="#5eead4" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700" letter-spacing="2">FLEX ASM — cardinalité 3, quel que soit n</text>

  <!-- ASM CLASSIQUE : 3 noeuds, 3 instances ASM -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <g>
      <rect x="36" y="70" width="106" height="96" rx="12" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="89" y="92" text-anchor="middle" fill="#cbd5e1" font-size="11">node1</text>
      <rect x="48" y="102" width="82" height="24" rx="5" fill="#134e4a"/>
      <text x="89" y="119" text-anchor="middle" fill="#a7f3d0" font-size="10.5">DB orcl1</text>
      <rect x="48" y="132" width="82" height="24" rx="5" fill="url(#faAsm)"/>
      <text x="89" y="149" text-anchor="middle" fill="#04140f" font-size="10.5" font-weight="700">+ASM1</text>
    </g>
    <g>
      <rect x="156" y="70" width="106" height="96" rx="12" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="209" y="92" text-anchor="middle" fill="#cbd5e1" font-size="11">node2</text>
      <rect x="168" y="102" width="82" height="24" rx="5" fill="#134e4a"/>
      <text x="209" y="119" text-anchor="middle" fill="#a7f3d0" font-size="10.5">DB orcl2</text>
      <rect x="168" y="132" width="82" height="24" rx="5" fill="url(#faAsm)"/>
      <text x="209" y="149" text-anchor="middle" fill="#04140f" font-size="10.5" font-weight="700">+ASM2</text>
    </g>
    <g>
      <rect x="276" y="70" width="106" height="96" rx="12" fill="#2e0512" stroke="#fb7185" stroke-opacity="0.7"/>
      <text x="329" y="92" text-anchor="middle" fill="#fecdd3" font-size="11">node3 — panne ASM</text>
      <rect x="288" y="102" width="82" height="24" rx="5" fill="#4c0519"/>
      <text x="329" y="119" text-anchor="middle" fill="#fda4af" font-size="10.5">DB orcl3 ✕</text>
      <rect x="288" y="132" width="82" height="24" rx="5" fill="none" stroke="#fb7185" stroke-dasharray="4 3"/>
      <text x="329" y="149" text-anchor="middle" fill="#fb7185" font-size="10.5" font-weight="700">+ASM3 ✕</text>
    </g>

    <path d="M89 166 V196 M209 166 V196 M329 166 V196" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="36" y="196" width="346" height="44" rx="10" fill="#052e29" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="209" y="223" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">Stockage partagé</text>

    <text x="36" y="278" fill="#fecdd3" font-size="12.5">La perte de +ASM3 entraîne la perte de</text>
    <text x="36" y="298" fill="#fecdd3" font-size="12.5">TOUTES les bases du nœud 3.</text>
    <text x="36" y="326" fill="#64748b" font-size="12">Une panne locale devient une indisponibilité</text>
    <text x="36" y="344" fill="#64748b" font-size="12">complète du nœud.</text>
  </g>

  <!-- FLEX ASM : 5 noeuds, 3 instances ASM -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <g>
      <rect x="436" y="70" width="64" height="96" rx="10" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="468" y="90" text-anchor="middle" fill="#cbd5e1" font-size="10">node1</text>
      <rect x="444" y="100" width="48" height="22" rx="4" fill="#134e4a"/>
      <text x="468" y="115" text-anchor="middle" fill="#a7f3d0" font-size="9.5">DB</text>
      <rect x="444" y="128" width="48" height="22" rx="4" fill="url(#faAsm)"/>
      <text x="468" y="143" text-anchor="middle" fill="#04140f" font-size="9" font-weight="700">+ASM1</text>
    </g>
    <g>
      <rect x="510" y="70" width="64" height="96" rx="10" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="542" y="90" text-anchor="middle" fill="#cbd5e1" font-size="10">node2</text>
      <rect x="518" y="100" width="48" height="22" rx="4" fill="#134e4a"/>
      <text x="542" y="115" text-anchor="middle" fill="#a7f3d0" font-size="9.5">DB</text>
      <rect x="518" y="128" width="48" height="22" rx="4" fill="url(#faAsm)"/>
      <text x="542" y="143" text-anchor="middle" fill="#04140f" font-size="9" font-weight="700">+ASM2</text>
    </g>
    <g>
      <rect x="584" y="70" width="64" height="96" rx="10" fill="#2e0512" stroke="#fb7185" stroke-opacity="0.6"/>
      <text x="616" y="90" text-anchor="middle" fill="#fecdd3" font-size="10">node3 ✕</text>
      <rect x="592" y="100" width="48" height="22" rx="4" fill="#134e4a"/>
      <text x="616" y="115" text-anchor="middle" fill="#a7f3d0" font-size="9.5">DB ✓</text>
      <rect x="592" y="128" width="48" height="22" rx="4" fill="none" stroke="#fb7185" stroke-dasharray="3 3"/>
      <text x="616" y="143" text-anchor="middle" fill="#fb7185" font-size="9" font-weight="700">+ASM3 ✕</text>
    </g>
    <g>
      <rect x="658" y="70" width="50" height="96" rx="10" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="683" y="90" text-anchor="middle" fill="#cbd5e1" font-size="10">node4</text>
      <rect x="664" y="100" width="38" height="22" rx="4" fill="#134e4a"/>
      <text x="683" y="115" text-anchor="middle" fill="#a7f3d0" font-size="9.5">DB</text>
    </g>
    <g>
      <rect x="716" y="70" width="50" height="96" rx="10" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.4"/>
      <text x="741" y="90" text-anchor="middle" fill="#cbd5e1" font-size="10">node5</text>
      <rect x="722" y="100" width="38" height="22" rx="4" fill="#134e4a"/>
      <text x="741" y="115" text-anchor="middle" fill="#a7f3d0" font-size="9.5">DB</text>
    </g>

    <!-- reseau ASM -->
    <path d="M616 122 C 580 180, 520 150, 492 166" fill="none" stroke="#5eead4" stroke-width="2" stroke-opacity="0.85"/>
    <path d="M683 122 C 640 180, 580 152, 552 166" fill="none" stroke="#5eead4" stroke-width="2" stroke-opacity="0.6"/>
    <path d="M741 122 C 700 190, 600 156, 566 166" fill="none" stroke="#5eead4" stroke-width="2" stroke-opacity="0.45"/>
    <text x="602" y="190" fill="#5eead4" font-size="10.5" font-weight="700">réseau ASM</text>

    <path d="M468 166 V206 M542 166 V206" stroke="#2dd4bf" stroke-opacity="0.4" stroke-width="2"/>
    <rect x="436" y="206" width="330" height="44" rx="10" fill="#052e29" stroke="#5eead4" stroke-opacity="0.4"/>
    <text x="601" y="233" text-anchor="middle" fill="#a7f3d0" font-size="12" font-weight="700">Stockage partagé</text>

    <text x="436" y="288" fill="#86efac" font-size="12.5">La base du nœud 3 se rattache à +ASM1</text>
    <text x="436" y="308" fill="#86efac" font-size="12.5">et continue de tourner.</text>
    <text x="436" y="336" fill="#64748b" font-size="12">Les nœuds 4 et 5 n'ont aucune instance ASM</text>
    <text x="436" y="354" fill="#64748b" font-size="12">locale — et fonctionnent normalement.</text>
  </g>

  <rect x="36" y="376" width="730" height="54" rx="12" fill="#04241f" stroke="#5eead4" stroke-opacity="0.3"/>
  <text x="401" y="399" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">srvctl modify asm -count 3   ·   asmcmd showclustermode   ·   gv$asm_client</text>
  <text x="401" y="419" text-anchor="middle" fill="#64748b" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5">Prérequis : COMPATIBLE.ASM ≥ 12.1 sur tous les groupes de disques</text>
</svg>
