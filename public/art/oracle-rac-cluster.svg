<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Oracle Real Application Clusters : deux instances, interconnexion Cache Fusion et stockage ASM partage">
  <defs>
    <linearGradient id="racBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04140f"/><stop offset="100%" stop-color="#062a26"/>
    </linearGradient>
    <linearGradient id="racNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/><stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="racDisk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/><stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <pattern id="racGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="racArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#racBg)"/>
  <rect width="800" height="600" fill="url(#racGrid)"/>

  <text x="56" y="60" fill="#5eead4" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">1Z0-078 · CLUSTERWARE, ASM &amp; RAC</text>
  <text x="56" y="96" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="26" font-weight="700">Une base, plusieurs instances actives</text>

  <!-- SCAN -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="284" y="132" width="232" height="58" rx="14" fill="#052e29" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="400" y="157" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">SCAN — cluster-scan</text>
    <text x="400" y="177" text-anchor="middle" fill="#94a3b8" font-size="11.5">3 adresses en tourniquet DNS</text>
    <path d="M340 190 L232 236" stroke="#5eead4" stroke-opacity="0.6" stroke-width="2" marker-end="url(#racArrow)"/>
    <path d="M460 190 L568 236" stroke="#5eead4" stroke-opacity="0.6" stroke-width="2" marker-end="url(#racArrow)"/>
  </g>

  <!-- Noeud 1 -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="72" y="246" width="256" height="132" rx="18" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="96" y="270" width="208" height="42" rx="8" fill="url(#racNode)" opacity="0.85"/>
    <text x="200" y="297" text-anchor="middle" fill="#04140f" font-size="14" font-weight="700">Instance orcl1</text>
    <text x="200" y="336" text-anchor="middle" fill="#a7f3d0" font-size="11.5">SGA · buffer cache · LMS</text>
    <text x="200" y="358" text-anchor="middle" fill="#64748b" font-size="11.5">thread 1 · UNDOTBS1</text>
  </g>

  <!-- Noeud 2 -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="472" y="246" width="256" height="132" rx="18" fill="#052e29" stroke="#2dd4bf" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="496" y="270" width="208" height="42" rx="8" fill="url(#racNode)" opacity="0.85"/>
    <text x="600" y="297" text-anchor="middle" fill="#04140f" font-size="14" font-weight="700">Instance orcl2</text>
    <text x="600" y="336" text-anchor="middle" fill="#a7f3d0" font-size="11.5">SGA · buffer cache · LMS</text>
    <text x="600" y="358" text-anchor="middle" fill="#64748b" font-size="11.5">thread 2 · UNDOTBS2</text>
  </g>

  <!-- Interconnexion -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <path d="M328 300 H472" stroke="#5eead4" stroke-width="3"/>
    <path d="M336 316 H464" stroke="#5eead4" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="6 5"/>
    <rect x="332" y="266" width="136" height="26" rx="8" fill="#04140f" stroke="#5eead4" stroke-opacity="0.5"/>
    <text x="400" y="284" text-anchor="middle" fill="#5eead4" font-size="11.5" font-weight="700">Cache Fusion</text>
  </g>

  <!-- Stockage partage ASM -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <path d="M200 378 V430 H400 V456" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M600 378 V430 H400" fill="none" stroke="#2dd4bf" stroke-opacity="0.45" stroke-width="2"/>

    <rect x="176" y="456" width="448" height="112" rx="18" fill="#052e29" stroke="#5eead4" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="400" y="484" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Stockage partagé — ASM</text>

    <ellipse cx="256" cy="524" rx="34" ry="11" fill="url(#racDisk)"/>
    <path d="M222 524 v18 a34 11 0 0 0 68 0 v-18" fill="url(#racDisk)" opacity="0.7"/>
    <ellipse cx="368" cy="524" rx="34" ry="11" fill="url(#racDisk)"/>
    <path d="M334 524 v18 a34 11 0 0 0 68 0 v-18" fill="url(#racDisk)" opacity="0.7"/>
    <ellipse cx="480" cy="524" rx="34" ry="11" fill="url(#racDisk)"/>
    <path d="M446 524 v18 a34 11 0 0 0 68 0 v-18" fill="url(#racDisk)" opacity="0.7"/>

    <text x="568" y="518" text-anchor="middle" fill="#94a3b8" font-size="11">OCR</text>
    <text x="568" y="536" text-anchor="middle" fill="#94a3b8" font-size="11">voting ×3</text>
  </g>
</svg>
