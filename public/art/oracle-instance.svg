<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Oracle instance architecture: SGA, background processes and PGA">
  <defs>
    <linearGradient id="oiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05121d"/>
      <stop offset="100%" stop-color="#0a2334"/>
    </linearGradient>
    <radialGradient id="oiHalo" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="oiGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#oiBg)"/>
  <rect width="1200" height="800" fill="url(#oiGrid)"/>
  <rect width="1200" height="800" fill="url(#oiHalo)"/>

  <!-- Instance outer frame -->
  <rect x="90" y="90" width="1020" height="360" rx="24" fill="none" stroke="#7dd3fc" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="2 10"/>
  <text x="120" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#e2f4ff">Instance</text>

  <!-- SGA block -->
  <rect x="130" y="130" width="600" height="280" rx="18" fill="#0d2a3f" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="152" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#bae6fd">SGA</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e2f4ff">
    <rect x="152" y="190" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="236" y="223" text-anchor="middle">Shared Pool</text>
    <text x="236" y="246" text-anchor="middle" font-size="13" fill="#93c5fd" opacity="0.8">Library Cache · Dictionary Cache</text>

    <rect x="340" y="190" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="424" y="223" text-anchor="middle">Buffer Cache</text>
    <text x="424" y="246" text-anchor="middle" font-size="13" fill="#93c5fd" opacity="0.8">Cached data blocks</text>

    <rect x="528" y="190" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="612" y="223" text-anchor="middle">Redo Log Buffer</text>
    <text x="612" y="246" text-anchor="middle" font-size="13" fill="#93c5fd" opacity="0.8">Change vectors</text>

    <rect x="152" y="290" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="236" y="323" text-anchor="middle">Large Pool</text>

    <rect x="340" y="290" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="424" y="323" text-anchor="middle">Java Pool</text>

    <rect x="528" y="290" width="168" height="76" rx="12" fill="#123249" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="612" y="323" text-anchor="middle">Streams Pool</text>
  </g>

  <!-- Background processes -->
  <text x="792" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#fecdd3">Background processes</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#fff1f2">
    <g transform="translate(792 200)">
      <circle r="30" fill="#a4180f"/><text y="6" text-anchor="middle" font-weight="700">SMON</text>
    </g>
    <g transform="translate(900 200)">
      <circle r="30" fill="#a4180f"/><text y="6" text-anchor="middle" font-weight="700">PMON</text>
    </g>
    <g transform="translate(792 280)">
      <circle r="30" fill="#dc2626"/><text y="6" text-anchor="middle" font-weight="700">DBWn</text>
    </g>
    <g transform="translate(900 280)">
      <circle r="30" fill="#dc2626"/><text y="6" text-anchor="middle" font-weight="700">LGWR</text>
    </g>
    <g transform="translate(846 360)">
      <circle r="30" fill="#ef4444"/><text y="6" text-anchor="middle" font-weight="700">CKPT</text>
    </g>
  </g>

  <!-- Datafiles / redo logs below -->
  <g transform="translate(300 560)">
    <ellipse cx="0" cy="60" rx="150" ry="30" fill="#000" fill-opacity="0.3"/>
    <path d="M-120 0a120 30 0 0 1 240 0v60a120 30 0 0 1-240 0Z" fill="#0d2a3f" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="#123249" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#bae6fd">Datafiles</text>
  </g>
  <g transform="translate(900 560)">
    <ellipse cx="0" cy="60" rx="150" ry="30" fill="#000" fill-opacity="0.3"/>
    <path d="M-120 0a120 30 0 0 1 240 0v60a120 30 0 0 1-240 0Z" fill="#3a0f10" stroke="#f04438" stroke-opacity="0.55" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="120" ry="30" fill="#4c1315" stroke="#f04438" stroke-opacity="0.7" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#fecdd3">Online Redo Logs</text>
  </g>

  <g stroke="#7dd3fc" stroke-opacity="0.6" stroke-width="2.5" fill="none">
    <path d="M424 366 L300 560"/>
    <path d="M612 366 L900 560"/>
  </g>

  <text x="600" y="770" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#93c5fd" opacity="0.75">One instance, one set of memory structures and processes — the foundation of Oracle Database Administration I</text>
</svg>
