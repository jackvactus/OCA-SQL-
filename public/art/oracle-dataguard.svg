<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Oracle Data Guard : base principale, instance Far Sync et base de secours physique">
  <defs>
    <linearGradient id="dgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0618"/><stop offset="100%" stop-color="#1e1145"/>
    </linearGradient>
    <linearGradient id="dgPri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="dgStb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <pattern id="dgGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a78bfa" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <marker id="dgArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="url(#dgBg)"/>
  <rect width="800" height="600" fill="url(#dgGrid)"/>

  <text x="56" y="60" fill="#c4b5fd" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700" letter-spacing="2.5">1Z0-076 · DATA GUARD</text>
  <text x="56" y="96" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="26" font-weight="700">Zéro perte, même à 6 000 km</text>

  <!-- Base principale -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="56" y="160" width="200" height="180" rx="18" fill="#150b2e" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="1.5"/>
    <ellipse cx="156" cy="212" rx="52" ry="16" fill="url(#dgPri)"/>
    <path d="M104 212 v40 a52 16 0 0 0 104 0 v-40" fill="url(#dgPri)" opacity="0.75"/>
    <ellipse cx="156" cy="252" rx="52" ry="16" fill="url(#dgPri)" opacity="0.9"/>
    <text x="156" y="300" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PRIMARY</text>
    <text x="156" y="322" text-anchor="middle" fill="#a5b4fc" font-size="12">Paris · orcl_pr</text>
  </g>

  <!-- Far Sync -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="320" y="196" width="160" height="108" rx="16" fill="#150b2e" stroke="#c4b5fd" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="400" y="234" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">FAR SYNC</text>
    <text x="400" y="256" text-anchor="middle" fill="#a5b4fc" font-size="11.5">standby redo logs</text>
    <text x="400" y="274" text-anchor="middle" fill="#64748b" font-size="11">aucun fichier de données</text>
  </g>

  <!-- Base de secours -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="544" y="160" width="200" height="180" rx="18" fill="#062033" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <ellipse cx="644" cy="212" rx="52" ry="16" fill="url(#dgStb)"/>
    <path d="M592 212 v40 a52 16 0 0 0 104 0 v-40" fill="url(#dgStb)" opacity="0.75"/>
    <ellipse cx="644" cy="252" rx="52" ry="16" fill="url(#dgStb)" opacity="0.9"/>
    <text x="644" y="300" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">PHYSICAL STANDBY</text>
    <text x="644" y="322" text-anchor="middle" fill="#7dd3fc" font-size="12">Montréal · orcl_sb</text>
  </g>

  <!-- Flux -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <path d="M256 250 H316" stroke="#a78bfa" stroke-width="3" marker-end="url(#dgArrow)"/>
    <text x="286" y="238" text-anchor="middle" fill="#c4b5fd" font-size="11.5" font-weight="700">SYNC</text>
    <path d="M484 250 H540" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#dgArrow)"/>
    <text x="512" y="238" text-anchor="middle" fill="#c4b5fd" font-size="11.5" font-weight="700">ASYNC</text>
  </g>

  <!-- Modes de protection -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <rect x="56" y="396" width="216" height="86" rx="14" fill="#150b2e" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="164" y="424" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Maximum Protection</text>
    <text x="164" y="446" text-anchor="middle" fill="#94a3b8" font-size="11.5">SYNC · aucune perte</text>
    <text x="164" y="466" text-anchor="middle" fill="#fb7185" font-size="11.5">la production s'arrête</text>

    <rect x="292" y="396" width="216" height="86" rx="14" fill="#150b2e" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="400" y="424" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Maximum Availability</text>
    <text x="400" y="446" text-anchor="middle" fill="#94a3b8" font-size="11.5">SYNC / FASTSYNC</text>
    <text x="400" y="466" text-anchor="middle" fill="#4ade80" font-size="11.5">dégrade proprement</text>

    <rect x="528" y="396" width="216" height="86" rx="14" fill="#150b2e" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="636" y="424" text-anchor="middle" fill="#ffffff" font-size="13.5" font-weight="700">Maximum Performance</text>
    <text x="636" y="446" text-anchor="middle" fill="#94a3b8" font-size="11.5">ASYNC · perte possible</text>
    <text x="636" y="466" text-anchor="middle" fill="#4ade80" font-size="11.5">latence minimale</text>
  </g>

  <!-- Observateur -->
  <g font-family="system-ui,Segoe UI,sans-serif">
    <circle cx="400" cy="530" r="20" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="400" cy="530" r="6" fill="#fbbf24"/>
    <text x="434" y="527" fill="#fde68a" font-size="13" font-weight="700">Observateur — troisième site</text>
    <text x="434" y="546" fill="#64748b" font-size="11.5">arbitre le Fast-Start Failover</text>
  </g>
</svg>
