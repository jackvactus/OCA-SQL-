<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Infrastructure Oracle Database">
  <defs>
    <linearGradient id="dcSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#061420"/>
      <stop offset="55%" stop-color="#08202f"/>
      <stop offset="100%" stop-color="#04090f"/>
    </linearGradient>
    <linearGradient id="dcRack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123246"/>
      <stop offset="100%" stop-color="#0a1b28"/>
    </linearGradient>
    <linearGradient id="dcCyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f04438"/>
      <stop offset="100%" stop-color="#b42318"/>
    </linearGradient>
    <linearGradient id="dcFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dcGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dcGrid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#38bdf8" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#dcSky)"/>
  <rect width="1600" height="900" fill="url(#dcGrid)"/>
  <rect width="1600" height="900" fill="url(#dcGlow)"/>

