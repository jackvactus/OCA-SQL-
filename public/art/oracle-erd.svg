<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Modèle relationnel : EMPLOYEES, DEPARTMENTS, JOBS">
  <defs>
    <linearGradient id="erdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04121c"/>
      <stop offset="100%" stop-color="#0a2434"/>
    </linearGradient>
    <linearGradient id="erdHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c02418"/>
      <stop offset="100%" stop-color="#f04438"/>
    </linearGradient>
    <linearGradient id="erdHead2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="erdHead3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="erdGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="760" fill="url(#erdBg)"/>
  <rect width="1200" height="760" fill="url(#erdGrid)"/>

  <!-- relations -->
  <g fill="none" stroke="#7dd3fc" stroke-opacity="0.6" stroke-width="2.5">
    <path d="M356 300 H 470 V 232 H 596"/>
    <path d="M356 372 H 512 V 560 H 596"/>
  </g>
  <!-- pattes de corbeau côté « plusieurs » -->
  <g stroke="#7dd3fc" stroke-opacity="0.8" stroke-width="2.5" fill="none">
    <path d="M356 300 l-22 -12 M356 300 l-22 12"/>
    <path d="M356 372 l-22 -12 M356 372 l-22 12"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7dd3fc" fill-opacity="0.9">
    <text x="392" y="288">N</text>
    <text x="566" y="224">1</text>
    <text x="392" y="360">N</text>
    <text x="566" y="552">1</text>
  </g>

  <!-- EMPLOYEES -->
  <g>
    <rect x="80" y="200" width="276" height="330" rx="14" fill="#0b2131" stroke="#1d5573" stroke-width="2"/>
    <path d="M80 214a14 14 0 0 1 14-14h248a14 14 0 0 1 14 14v40H80Z" fill="url(#erdHead)"/>
    <text x="104" y="242" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" letter-spacing="1">EMPLOYEES</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">
      <text x="104" y="290">employee_id</text>
      <text x="104" y="326">first_name</text>
      <text x="104" y="362">last_name</text>
      <text x="104" y="398">salary</text>
      <text x="104" y="434">department_id</text>
      <text x="104" y="470">job_id</text>
      <text x="104" y="506">manager_id</text>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
      <rect x="292" y="277" width="30" height="18" rx="5" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="298" y="290" fill="#fbbf24">PK</text>
      <rect x="292" y="421" width="30" height="18" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="298" y="434" fill="#7dd3fc">FK</text>
      <rect x="292" y="457" width="30" height="18" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="298" y="470" fill="#7dd3fc">FK</text>
      <rect x="292" y="493" width="30" height="18" rx="5" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-opacity="0.6"/>
      <text x="296" y="506" fill="#c4b5fd">FK</text>
    </g>
    <text x="104" y="524" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">auto-jointure</text>
  </g>

  <!-- DEPARTMENTS -->
  <g>
    <rect x="596" y="132" width="276" height="220" rx="14" fill="#0b2131" stroke="#1d5573" stroke-width="2"/>
    <path d="M596 146a14 14 0 0 1 14-14h248a14 14 0 0 1 14 14v40H596Z" fill="url(#erdHead2)"/>
    <text x="620" y="174" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" letter-spacing="1">DEPARTMENTS</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">
      <text x="620" y="222">department_id</text>
      <text x="620" y="258">department_name</text>
      <text x="620" y="294">manager_id</text>
      <text x="620" y="330">location_id</text>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
      <rect x="808" y="209" width="30" height="18" rx="5" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="814" y="222" fill="#fbbf24">PK</text>
    </g>
  </g>

  <!-- JOBS -->
  <g>
    <rect x="596" y="460" width="276" height="184" rx="14" fill="#0b2131" stroke="#1d5573" stroke-width="2"/>
    <path d="M596 474a14 14 0 0 1 14-14h248a14 14 0 0 1 14 14v40H596Z" fill="url(#erdHead3)"/>
    <text x="620" y="502" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff" letter-spacing="1">JOBS</text>
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#cbd5e1">
      <text x="620" y="550">job_id</text>
      <text x="620" y="586">job_title</text>
      <text x="620" y="622">min_salary</text>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700">
      <rect x="808" y="537" width="30" height="18" rx="5" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.6"/>
      <text x="814" y="550" fill="#fbbf24">PK</text>
    </g>
  </g>

  <!-- légende -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <rect x="920" y="674" width="212" height="56" rx="10" fill="#0b2131" stroke="#1d5573" stroke-width="1.5"/>
    <rect x="938" y="690" width="26" height="16" rx="5" fill="#fbbf24" fill-opacity="0.22" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="944" y="703" font-size="10" font-weight="700" fill="#fbbf24">PK</text>
    <text x="974" y="703" fill="#94a3b8">clé primaire</text>
    <rect x="938" y="712" width="26" height="16" rx="5" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6"/>
    <text x="944" y="725" font-size="10" font-weight="700" fill="#7dd3fc">FK</text>
    <text x="974" y="725" fill="#94a3b8">clé étrangère</text>
  </g>
</svg>
