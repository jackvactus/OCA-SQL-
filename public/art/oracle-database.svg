<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Pile Oracle Database">
  <defs>
    <linearGradient id="odBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05121d"/>
      <stop offset="100%" stop-color="#0a2334"/>
    </linearGradient>
    <linearGradient id="odCyl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f04438"/>
      <stop offset="100%" stop-color="#a4180f"/>
    </linearGradient>
    <radialGradient id="odHalo" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f04438" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f04438" stop-opacity="0"/>
    </radialGradient>
    <pattern id="odGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#38bdf8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#odBg)"/>
  <rect width="1200" height="800" fill="url(#odGrid)"/>
  <rect width="1200" height="800" fill="url(#odHalo)"/>

  <!-- pile de cylindres -->
  <g transform="translate(600 400)">
    <ellipse cx="0" cy="232" rx="250" ry="46" fill="#000" fill-opacity="0.35"/>
    <!-- niveau bas -->
    <path d="M-190 96a190 52 0 0 1 380 0v72a190 52 0 0 1-380 0Z" fill="url(#odCyl)" opacity="0.7"/>
    <ellipse cx="0" cy="96" rx="190" ry="52" fill="#dc2626" opacity="0.85"/>
    <!-- niveau milieu -->
    <path d="M-190 -20a190 52 0 0 1 380 0v72a190 52 0 0 1-380 0Z" fill="url(#odCyl)" opacity="0.85"/>
    <ellipse cx="0" cy="-20" rx="190" ry="52" fill="#ef4444" opacity="0.9"/>
    <!-- niveau haut -->
    <path d="M-190 -136a190 52 0 0 1 380 0v72a190 52 0 0 1-380 0Z" fill="url(#odCyl)"/>
    <ellipse cx="0" cy="-136" rx="190" ry="52" fill="#fb7185"/>
    <ellipse cx="0" cy="-136" rx="190" ry="52" fill="none" stroke="#fecdd3" stroke-opacity="0.6" stroke-width="3"/>
    <!-- reflets -->
    <path d="M-190 -100a190 52 0 0 0 380 0" fill="none" stroke="#fecdd3" stroke-opacity="0.30" stroke-width="3"/>
    <path d="M-190 16a190 52 0 0 0 380 0" fill="none" stroke="#fecdd3" stroke-opacity="0.24" stroke-width="3"/>
    <path d="M-190 132a190 52 0 0 0 380 0" fill="none" stroke="#fecdd3" stroke-opacity="0.18" stroke-width="3"/>
  </g>

  <!-- badge SQL -->
  <g transform="translate(842 452)">
    <rect x="-84" y="-44" width="168" height="88" rx="22" fill="#f8fafc" stroke="#f04438" stroke-width="5"/>
    <text x="0" y="16" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#c02418" letter-spacing="3">SQL</text>
  </g>

  <!-- connexions -->
  <g stroke="#38bdf8" stroke-opacity="0.5" stroke-width="3" fill="none">
    <path d="M240 250 L406 296"/>
    <path d="M240 550 L406 500"/>
    <path d="M960 250 L806 292"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="230" cy="248" r="9"/><circle cx="230" cy="552" r="9"/><circle cx="970" cy="248" r="9"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#bae6fd" fill-opacity="0.85">
    <text x="120" y="216">Tables</text>
    <text x="120" y="596">Index</text>
    <text x="930" y="216">Vues</text>
  </g>
</svg>
